spring:
  application:
    name: risk-assessment-service

  main:
    web-application-type: servlet

server:
  port: ${SERVER_PORT:8083}
  forward-headers-strategy: framework

logging:
  level:
    org.springframework.security: INFO
    com.medilabo.riskassessment: DEBUG

# ==============================
#   URLs des microservices (mode local)
# ==============================
patients:
  api:
    base: ${PATIENT_API_BASE_URL:http://localhost:8080/api/patients}

notes:
  api:
    base: ${NOTE_API_BASE_URL:http://localhost:8080/api/notes}

risk:
  api:
    base: ${RISK_API_BASE_URL:http://localhost:8080/api/risk}

# ==============================
#   JWT (Secret partagé)
# ==============================
jwt:
  secret: ${JWT_SECRET:0123456789abcdefghijklmnopqrstuvwxyz012345}
  issuer: ${JWT_ISSUER:medilabo-auth}
  audience: ${JWT_AUDIENCE:gateway,patient,note,risk}
  ttl-seconds: ${JWT_TTL_SECONDS:43200}

# ==============================
#   Gestion et surveillance
# ==============================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
