spring:
  application:
    name: risk-assessment-service
  main:
    web-application-type: servlet

server:
  port: ${SERVER_PORT:8083}
  forward-headers-strategy: framework

# ==============================
# Base URL des microservices en LOCAL (sans Gateway)
# ==============================
patients:
  api:
    # URL complète directement vers patient-service en local
    url: ${PATIENT_API_BASE_URL:http://localhost:8081/api/patients}

notes:
  api:
    # URL complète directement vers note-service en local
    url: ${NOTE_API_BASE_URL:http://localhost:8082/api/notes}

# (facultatif) si ton service expose aussi /api/risk via le Gateway, tu peux garder ça :
gateway:
  base-url: ${GATEWAY_BASE_URL:http://localhost:8080}
risk:
  api:
    base: ${RISK_API_BASE:/api/risk}
    url: ${RISK_API_BASE_URL:${gateway.base-url}${risk.api.base}}

# ==============================
# JWT partagé
# ==============================
jwt:
  secret: ${JWT_SECRET:0123456789abcdefghijklmnopqrstuvwxyz012345}
  issuer: ${JWT_ISSUER:medilabo-auth}
  audience: ${JWT_AUDIENCE:gateway,patient,note,risk}
  ttl-seconds: ${JWT_TTL_SECONDS:43200}

security:
  jwt:
    secret: ${JWT_SECRET:0123456789abcdefghijklmnopqrstuvwxyz012345}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
    com.medilabo.riskassessment: DEBUG
