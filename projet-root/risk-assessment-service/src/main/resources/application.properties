# =====================================
# Application
# =====================================
spring.application.name=risk-assessment-service
server.port=8083
server.forward-headers-strategy=framework

# =====================================
# Microservices URLs (local mode)
# =====================================
patients.api.base=${PATIENT_API_BASE_URL:http://localhost:8080/api/patients}
notes.api.base=${NOTE_API_BASE_URL:http://localhost:8080/api/notes}
risk.api.base=${RISK_API_BASE_URL:http://localhost:8080/api/risk}

# =====================================
# JWT Configuration (shared secret)
# =====================================
jwt.secret=${JWT_SECRET:0123456789abcdefghijklmnopqrstuvwxyz012345}
jwt.issuer=${JWT_ISSUER:medilabo-auth}
jwt.audience=${JWT_AUDIENCE:gateway,patient,note,risk}
jwt.ttl-seconds=${JWT_TTL_SECONDS:43200}

# =====================================
# Logging
# =====================================
logging.level.org.springframework.security=INFO
logging.level.com.medilabo.riskassessment=DEBUG

# =====================================
# Actuator Management
# =====================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
