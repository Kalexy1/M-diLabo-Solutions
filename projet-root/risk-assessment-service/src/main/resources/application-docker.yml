server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: risk-assessment-service

# 🔐 Secret JWT partagé (HS256) — identique à celui de auth-service et gateway
jwt:
  secret: ${JWT_SECRET:0123456789abcdefghijklmnopqrstuvwxyz012345}

# 🌐 URLs des microservices appelés via le Gateway (ou en réseau Docker)
patient:
  api:
    base-url: ${PATIENT_API_BASE_URL:http://gateway-service:8080/api/patients}
note:
  api:
    base-url: ${NOTE_API_BASE_URL:http://gateway-service:8080/api/notes}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO
    com.medilabo.riskassessment: INFO
