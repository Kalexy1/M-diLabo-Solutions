spring:
  application:
    name: risk-assessment-service
  main:
    web-application-type: servlet

server:
  port: ${SERVER_PORT:8083}
  forward-headers-strategy: framework

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
    com.medilabo.riskassessment: DEBUG

# ==============================
#   URLs des autres microservices en DOCKER (sans Gateway)
# ==============================
patients:
  api:
    url: ${PATIENT_API_BASE_URL:http://patient-service:8081/api/patients}

notes:
  api:
    url: ${NOTE_API_BASE_URL:http://note-service:8082/api/notes}

# Tu peux garder ça si tu exposes aussi /api/risk via le Gateway
gateway:
  base-url: ${GATEWAY_BASE_URL:http://gateway-service:8080}
risk:
  api:
    base: ${RISK_API_BASE:/api/risk}
    url: ${RISK_API_BASE_URL:${gateway.base-url}${risk.api.base}}

# ==============================
#   JWT (Token partagé entre services)
# ==============================
jwt:
  secret: ${JWT_SECRET:0123456789abcdefghijklmnopqrstuvwxyz012345}
  issuer: ${JWT_ISSUER:medilabo-auth}
  audience: ${JWT_AUDIENCE:gateway,patient,note,risk}
  ttl-seconds: ${JWT_TTL_SECONDS:43200}

security:
  jwt:
    secret: ${JWT_SECRET:0123456789abcdefghijklmnopqrstuvwxyz012345}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
