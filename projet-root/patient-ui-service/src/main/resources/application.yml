server:
  port: 8084
  forward-headers-strategy: framework  # redirections correctes derrière proxy

spring:
  application:
    name: patient-ui-service
  thymeleaf:
    cache: false  # dev (mets true en prod)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# =====================================
# JWT (identique partout)
# =====================================
jwt:
  secret: ${JWT_SECRET:0123456789abcdefghijklmnopqrstuvwxyz012345}
  issuer: ${JWT_ISSUER:medilabo-auth}
  audience: ${JWT_AUDIENCE:gateway,patient,note,risk}
  ttl-seconds: ${JWT_TTL_SECONDS:43200}

# =====================================
# Base URL de la Gateway
# - Local: http://localhost:8080
# - Docker: injecte GATEWAY_BASE_URL=http://gateway-service:8080
# =====================================
gateway:
  base-url: ${GATEWAY_BASE_URL:http://localhost:8080}

# =====================================
# APIs derrière la Gateway
# - *.api.base : chemin (stable)
# - *.api.url  : URL complète. Si *_BASE_URL est fourni, on l’utilise;
#                sinon on compose gateway.base-url + *.api.base
# =====================================
patients:
  api:
    base: ${PATIENT_API_BASE:/api/patients}
    url: ${PATIENT_API_BASE_URL:${gateway.base-url}${patients.api.base}}

notes:
  api:
    base: ${NOTE_API_BASE:/api/notes}
    url: ${NOTE_API_BASE_URL:${gateway.base-url}${notes.api.base}}

risk:
  api:
    base: ${RISK_API_BASE:/api/risk}
    url: ${RISK_API_BASE_URL:${gateway.base-url}${risk.api.base}}

auth:
  api:
    base: ${AUTH_API_BASE:/auth}
    url: ${AUTH_API_BASE_URL:${gateway.base-url}${auth.api.base}}

# =====================================
# Actuator
# =====================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# =====================================
# Logging
# =====================================
logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
    com.medilabo.patientui: DEBUG
