server:
  port: 8084

spring:
  application:
    name: patient-ui-service
  thymeleaf:
    cache: false

# Secret JWT identique à auth/patient/note/risk
jwt:
  secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}

# Base URL de la gateway (local)
gateway:
  base-url: http://localhost:8080

# Chemins d’API exposés derrière la gateway (avec /api)
patients:
  api:
    base: /api/patients
notes:
  api:
    base: /api/notes
risk:
  api:
    base: /api/risk

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO
    com.medilabo.patientui: INFO
