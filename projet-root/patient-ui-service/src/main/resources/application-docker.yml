server:
  port: ${SERVER_PORT:8084}
  forward-headers-strategy: framework

spring:
  application:
    name: patient-ui-service
  thymeleaf:
    # true = perf en conteneur ; passe à false uniquement en dev local
    cache: ${THYMELEAF_CACHE:true}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

# ==============================
# JWT (identique dans tout l'écosystème)
# ==============================
jwt:
  secret: ${JWT_SECRET:0123456789abcdefghijklmnopqrstuvwxyz012345}
  issuer: ${JWT_ISSUER:medilabo-auth}
  audience: ${JWT_AUDIENCE:gateway,patient,note,risk}
  ttl-seconds: ${JWT_TTL_SECONDS:43200}

# ==============================
# Gateway (DNS Docker)
# ==============================
gateway:
  base-url: ${GATEWAY_BASE_URL:http://gateway-service:8080}

# ==============================
# Chemins d'API derrière la Gateway
# ==============================
patients:
  api:
    base: ${PATIENT_API_BASE_PATH:/api/patients}
notes:
  api:
    base: ${NOTE_API_BASE_PATH:/api/notes}
risk:
  api:
    base: ${RISK_API_BASE_PATH:/api/risk}

# ==============================
# Actuator
# ==============================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ==============================
# Logging
# ==============================
logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
    com.medilabo.patientui: INFO
