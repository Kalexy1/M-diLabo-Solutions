server:
  port: 8084

spring:
  application:
    name: patient-ui-service
  thymeleaf:
    cache: true

# Secret JWT partagé (transmis via variable d'environnement JWT_SECRET)
jwt:
  secret: ${JWT_SECRET}

# En Docker, on vise le nom du service gateway
gateway:
  base-url: http://gateway-service:8080

# Chemins d’API exposés derrière la gateway
patients:
  api:
    base: /api/patients
notes:
  api:
    base: /api/notes
risk:
  api:
    base: /api/risk

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO
    com.medilabo.patientui: INFO
