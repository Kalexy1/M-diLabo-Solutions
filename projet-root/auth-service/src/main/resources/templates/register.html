<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Créer un compte</title>
</head>
<body>
  <main>
    <h2>Créer un compte</h2>

    <form th:action="@{/auth/register}" th:object="${user}" method="post" novalidate>
      <input type="hidden" name="redirect" th:value="${param.redirect}" />

      <div>
        <label for="username">Nom d'utilisateur :</label>
        <input type="text" id="username" th:field="*{username}" required autofocus />
        <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color:red"></div>
      </div>

      <div>
        <label for="password">Mot de passe :</label>
        <input type="password" id="password" th:field="*{password}" required />
        <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red"></div>
      </div>

      <div>
        <label for="role">Rôle :</label>
        <select id="role" th:field="*{role}" required>
          <!-- Placeholder sans SpEL de comparaison -->
          <option value="" disabled selected>— Sélectionnez un rôle —</option>

          <!-- Les vraies options, la sélection sera faite automatiquement par th:field -->
          <option th:each="r : ${roles}"
                  th:value="${r}"
                  th:text="${r}">ROLE</option>
        </select>
        <div th:if="${#fields.hasErrors('role')}" th:errors="*{role}" style="color:red"></div>
      </div>

      <div>
        <button type="submit">S'inscrire</button>
      </div>
    </form>

    <div th:if="${param.error}">
      <p style="color:red" th:text="${param.error}">Une erreur est survenue</p>
    </div>

    <p>
      Déjà un compte ?
      <a th:href="@{/auth/login(redirect=${param.redirect})}">Se connecter</a>
    </p>
  </main>
</body>
</html>
