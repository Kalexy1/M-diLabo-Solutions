# =========================================
# APPLICATION
# =========================================
server.port=8085
server.forward-headers-strategy=framework
spring.application.name=auth-service

# =========================================
# THYMELEAF
# =========================================
# false en local pour recharger les templates à chaud
spring.thymeleaf.cache=false

# =========================================
# BASE DE DONNÉES (MySQL local)
# =========================================
spring.datasource.url=jdbc:mysql://localhost:3306/authdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =========================================
# JWT (identique pour tout l\u2019écosystème)
# =========================================
JWT_SECRET=0123456789abcdefghijklmnopqrstuvwxyz012345
JWT_TTL_SECONDS=43200
JWT_ISSUER=medilabo-auth
JWT_AUDIENCE=gateway,patient,note,risk

# =========================================
# UI / REDIRECTIONS
# =========================================
ui.base-url=http://localhost:8080

# =========================================
# COOKIE JWT
# =========================================
security.jwt.cookie.name=JWT_TOKEN
security.jwt.cookie.secure=false
security.jwt.cookie.samesite=Lax
security.jwt.ttl-seconds=43200

# =========================================
# MANAGEMENT (Actuator)
# =========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =========================================
# LOGGING
# =========================================
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.medilabo.authservice=DEBUG
