services:
  mysql:
    image: mysql:8
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin.01234
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-padmin.01234"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  mongo:
    image: mongo:5.0
    container_name: mongo-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/authdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: admin.01234
      JWT_SECRET: p9_6Y7QpA2mZb4RkC7tU1nV9xJ3sL8wE5hT2yG6qM1rD4fP8uK0cN5bV2zX7aL1
      JWT_TTL_SECONDS: "43200"
      JWT_ISSUER: medilabo-auth
      JWT_AUDIENCE: gateway,patient,note,risk
      SECURITY_JWT_COOKIE_NAME: JWT_TOKEN
      SECURITY_JWT_COOKIE_SECURE: "false"
      SECURITY_JWT_COOKIE_SAMESITE: Lax
      SECURITY_JWT_TTL_SECONDS: "43200"
      UI_BASE_URL: http://gateway-service:8080
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8085:8085"
    networks: [backend]

  patient-service:
    build:
      context: ./patient-service
    container_name: patient-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/patientdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: admin.01234
      JWT_SECRET: p9_6Y7QpA2mZb4RkC7tU1nV9xJ3sL8wE5hT2yG6qM1rD4fP8uK0cN5bV2zX7aL1
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks: [backend]

  note-service:
    build:
      context: ./note-service
    container_name: note-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/notesdb
      JWT_SECRET: p9_6Y7QpA2mZb4RkC7tU1nV9xJ3sL8wE5hT2yG6qM1rD4fP8uK0cN5bV2zX7aL1
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8082:8082"
    networks: [backend]

  risk-assessment-service:
    build:
      context: ./risk-assessment-service
    container_name: risk-assessment-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8083
      PATIENT_API_BASE_URL: http://gateway-service:8080/api/patients
      NOTE_API_BASE_URL: http://gateway-service:8080/api/notes
      JWT_SECRET: p9_6Y7QpA2mZb4RkC7tU1nV9xJ3sL8wE5hT2yG6qM1rD4fP8uK0cN5bV2zX7aL1
    depends_on:
      - patient-service
      - note-service
    ports:
      - "8083:8083"
    networks: [backend]

  patient-ui-service:
    build:
      context: ./patient-ui-service
    container_name: patient-ui-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8084
      GATEWAY_BASE_URL: http://gateway-service:8080
      PATIENT_API_BASE_URL: http://gateway-service:8080/api/patients
      NOTE_API_BASE_URL: http://gateway-service:8080/api/notes
      RISK_API_BASE_URL: http://gateway-service:8080/api/risk
      AUTH_API_BASE_URL: http://gateway-service:8080/auth
      JWT_SECRET: p9_6Y7QpA2mZb4RkC7tU1nV9xJ3sL8wE5hT2yG6qM1rD4fP8uK0cN5bV2zX7aL1
    ports:
      - "8084:8084"
    networks: [backend]

  gateway-service:
    build:
      context: ./gateway-service
    container_name: gateway-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      JWT_SECRET: p9_6Y7QpA2mZb4RkC7tU1nV9xJ3sL8wE5hT2yG6qM1rD4fP8uK0cN5bV2zX7aL1
    depends_on:
      - auth-service
      - patient-service
      - note-service
      - risk-assessment-service
      - patient-ui-service
    ports:
      - "8080:8080"
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  mysql-data:
  mongo-data:
