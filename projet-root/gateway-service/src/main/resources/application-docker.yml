server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  cloud:
    gateway:
      default-filters:
        - PreserveHostHeader
        - RewriteLocationResponseHeader=AS_IN_REQUEST, Location
        - RemoveResponseHeader=Server
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_FIRST

      routes:
        # ---------- UI ----------
        - id: patient-ui
          uri: http://patient-ui-service:8084
          predicates: [ Path=/ui/** ]
          filters: [ StripPrefix=1 ]

        # Racine -> UI
        - id: ui-root
          uri: http://patient-ui-service:8084
          predicates: [ Path=/ ]
          filters: [ SetPath=/ ]

        # ---------- AUTH ----------
        - id: auth-service
          uri: http://auth-service:8085
          predicates: [ Path=/auth/** ]
          filters:
            # ✅ ne pas forwarder Authorization vers auth
            - RemoveRequestHeader=Authorization
            # ✅ garder le Cookie (ne PAS l'enlever), sinon POST register/login peut échouer

        # Compat /login -> /auth/login
        - id: login-to-auth
          uri: http://auth-service:8085
          predicates: [ Path=/login ]
          filters:
            - SetPath=/auth/login
            - RemoveRequestHeader=Authorization
            # idem: on ne retire pas Cookie

        # ---------- APIs ----------
        - id: patient-api
          uri: http://patient-service:8081
          predicates: [ Path=/api/patients/** ]
          filters: [ StripPrefix=2 ]

        - id: note-api
          uri: http://note-service:8082
          predicates: [ Path=/api/notes/** ]
          filters: [ StripPrefix=2 ]

        - id: risk-api
          uri: http://risk-assessment-service:8083
          predicates: [ Path=/api/risk/** ]
          filters: [ StripPrefix=2 ]

      # (Optionnel) CORS global (si un front externe appelle le gateway)
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins: "${APP_ALLOWED_ORIGINS:http://localhost:8080}"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
