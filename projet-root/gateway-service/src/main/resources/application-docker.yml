server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: gateway-service

  main:
    web-application-type: servlet

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/medilabo_gateway?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:admin.01234}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

# ---- UI ----
ui:
  base-url: ${UI_BASE_URL:http://patient-ui-service:8084}

# ---- Patient Service ----
patients:
  backend:
    base-url: ${PATIENTS_BACKEND_BASE_URL:http://patient-service:8081/api}

# ---- Note Service ----
notes:
  backend:
    # ⚠️ IMPORTANT : doit pointer vers /api/notes
    base-url: ${NOTES_BACKEND_BASE_URL:http://note-service:8082/api}

# ---- Risk Assessment Service ----
risk:
  backend:
    base-url: ${RISK_BACKEND_BASE_URL:http://risk-assessment-service:8083/api}

# ---- JWT Configuration ----
security:
  jwt:
    secret: ${JWT_SECRET:0123456789abcdefghijklmnopqrstuvwxyz012345}
    ttl-seconds: 43200
    cookie:
      name: JWT_TOKEN
      secure: false
      samesite: Lax

logging:
  level:
    org.springframework.security: INFO
    com.medilabo.gatewayservice: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
